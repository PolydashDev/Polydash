[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
gas_limit = "300000000"
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 1000
seed = "0x504f4c59"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }

[lint]
lint_on_build = false
